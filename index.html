<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="X32 EQ Guide" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./touch-controls.css?v=16" />
    <link rel="stylesheet" href="./mobile-nav.css?v=16" />
    <link rel="stylesheet" href="./speech-presets.css?v=16" />
    <link rel="stylesheet" href="./measurement-confidence.css?v=16" />
    <link rel="stylesheet" href="./x32-ocr.css?v=16" />
    <link rel="stylesheet" href="./live-ipad-monitor.css?v=16" />
    <title>X32 Worship Sound Guide</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="./mobile-nav.js?v=16"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js?v=16', { updateViaCache: 'none' })
            .then((registration) => registration.update())
            .catch((error) => console.warn('Service worker registration failed', error))
        })
      }
    </script>
  </body>
</html>
